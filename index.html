<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>チワワクエスト</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'DotGothic16', sans-serif;
        background-color: #000;
        color: #f3f4f6;
        overflow: hidden; /* Prevent scrolling for joystick */
        touch-action: none;
      }
      /* Custom pixel-art styling utils */
      .pixel-corners {
        box-shadow: 
          -4px 0 0 0 currentColor,
          4px 0 0 0 currentColor,
          0 -4px 0 0 currentColor,
          0 4px 0 0 currentColor;
        margin: 4px;
      }
      .pixel-text-shadow {
        text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
      }
      /* Hide scrollbar */
      ::-webkit-scrollbar {
        display: none;
      }

      /* --- High Quality But Optimized Tile Patterns --- */
      
      /* Common tile base to reduce repaint cost */
      .tile-base {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
      }

      /* Grass: Checkboard pattern using simpler gradients */
      .tile-grass {
        background-color: #4ade80;
        background-image: linear-gradient(45deg, rgba(0,0,0,0.05) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.05) 75%, rgba(0,0,0,0.05));
        background-size: 24px 24px;
      }

      /* Dirt: Simple noise look */
      .tile-dirt {
        background-color: #a16207;
        background-image: radial-gradient(#713f12 20%, transparent 20%);
        background-size: 12px 12px;
      }

      /* Rock: Simplified beveled look */
      .tile-rock {
        background-color: #4b5563;
        border: 2px solid #374151; /* Use border instead of box-shadow for performance */
        background-image: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%, rgba(0,0,0,0.2) 100%);
      }

      /* Water: Reduced animation complexity */
      .tile-water {
        background-color: #3b82f6;
        opacity: 0.9;
        /* Simple highlight */
        box-shadow: inset 0 0 10px rgba(0,0,0,0.2); 
      }
      /* Only animate opacity slightly for water effect, cheaper than background-position */
      .tile-water::after {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(255,255,255,0.2);
        opacity: 0;
        animation: pulse-water 2s infinite ease-in-out;
      }
      @keyframes pulse-water {
        0%, 100% { opacity: 0; }
        50% { opacity: 0.3; }
      }

      /* Sand: Simple dots */
      .tile-sand {
        background-color: #fde047;
        background-image: radial-gradient(#d97706 15%, transparent 15%);
        background-size: 8px 8px;
      }
      
      /* Hole: Dark, inset look */
      .tile-hole {
        background-color: #291d15;
        box-shadow: inset 4px 4px 10px rgba(0,0,0,0.7);
        border: 2px solid #3f2e18;
      }

      /* Treasure Mark: Shiny Chest Look */
      .tile-treasure-mark {
        background-color: #b45309;
        position: relative;
        border: 2px solid #fcd34d;
      }
      .tile-treasure-mark::after {
        content: '🎁';
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
      }

      /* GPU Acceleration for Map Container */
      .map-container {
        will-change: transform;
        backface-visibility: hidden;
        transform: translateZ(0);
      }

      /* Target Marker Animation */
      @keyframes pulse-target {
        0% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
        70% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 10px 10px rgba(255, 215, 0, 0); }
        100% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
      }
      .target-marker {
        border: 2px solid #fbbf24; /* Amber-400 */
        border-radius: 4px;
        animation: pulse-target 1.5s infinite;
        pointer-events: none;
        z-index: 20;
      }
      /* Custom Animations for TreasureIcons */
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10%); }
      }
      @keyframes float-slow {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5%); }
      }
      @keyframes shimmer {
        100% { transform: translateX(100%); }
      }
      @keyframes spin-slow {
        100% { transform: rotate(360deg); }
      }
      @keyframes spin-slow-reverse {
        100% { transform: rotate(-360deg); }
      }
        @keyframes bounce-short {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-4px); }
        }
        .animate-bounce-short { animation: bounce-short 0.3s infinite; }
        @keyframes dig {
          0% { transform: translateY(0) rotate(0deg); }
          25% { transform: translateY(2px) rotate(-10deg); }
          50% { transform: translateY(4px) rotate(0deg); }
          75% { transform: translateY(2px) rotate(10deg); }
          100% { transform: translateY(0) rotate(0deg); }
        }
        .animate-dig { animation: dig 0.2s infinite; }
        @keyframes defeat {
            0% { transform: scale(1) rotate(0deg); filter: grayscale(0%); }
            20% { transform: scale(1.3) rotate(-20deg); filter: grayscale(0%); }
            50% { transform: scale(1.0) rotate(180deg); filter: grayscale(50%); }
            100% { transform: scale(0.8) rotate(360deg) translateY(10px); opacity: 0.6; filter: grayscale(100%); }
        }
        .animate-defeat { animation: defeat 1.5s forwards ease-in-out; }
        @keyframes throw-left {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translate(-25px, -15px) scale(0.5) rotate(-180deg); opacity: 0; }
        }
        .animate-throw-left { animation: throw-left 0.4s infinite ease-out; }
        @keyframes throw-right {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translate(25px, -15px) scale(0.5) rotate(180deg); opacity: 0; }
        }
        .animate-throw-right { animation: throw-right 0.4s infinite ease-out 0.2s; }
        @keyframes shovel-dig {
             0% { transform: rotate(15deg) translateY(0) translateX(2px); }
             50% { transform: rotate(-25deg) translateY(8px) translateX(-4px); }
             100% { transform: rotate(15deg) translateY(0) translateX(2px); }
        }
        .animate-shovel {
            animation: shovel-dig 0.4s infinite ease-in-out;
            transform-origin: bottom center;
        }

          @keyframes wiggle {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px) rotate(-5deg); }
            75% { transform: translateX(2px) rotate(5deg); }
          }
          .animate-wiggle { animation: wiggle 0.5s infinite ease-in-out; }
          @keyframes poison-splash {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
          }
          .animate-poison { animation: poison-splash 0.5s ease-out forwards; }
            @keyframes float {
              0%, 100% { transform: translateY(0); }
              50% { transform: translateY(-4px); }
            }
            .animate-float { animation: float 2s infinite ease-in-out; }
            @keyframes ghost-die {
              0% { transform: scale(1); opacity: 0.8; }
              100% { transform: scale(2); opacity: 0; }
            }
            .animate-ghost-die { animation: ghost-die 0.5s forwards; }

        @keyframes bounce-slow {
          0%, 100% { transform: scale(1, 1) translateY(0); }
          50% { transform: scale(1.1, 0.9) translateY(4px); }
        }
        .animate-bounce-slow { animation: bounce-slow 1.5s infinite ease-in-out; }
        @keyframes split-left {
          0% { transform: translate(0, 0) scale(1); opacity: 1; }
          100% { transform: translate(-20px, -10px) scale(0.5); opacity: 0; }
        }
        @keyframes split-right {
          0% { transform: translate(0, 0) scale(1); opacity: 1; }
          100% { transform: translate(20px, -10px) scale(0.5); opacity: 0; }
        }
        .animate-split-left { animation: split-left 0.5s ease-out forwards; }
        .animate-split-right { animation: split-right 0.5s ease-out forwards; }
        @keyframes slime-die {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .animate-slime-die { animation: slime-die 0.5s ease-out forwards; }

                  @keyframes fade-in-slow {
                      0% { opacity: 0; }
                      100% { opacity: 1; }
                  }
                  .animate-fade-in-slow { animation: fade-in-slow 1s ease-out forwards; }

        @keyframes bounce-in {
          0% { transform: scale(0.9); opacity: 0; }
          50% { transform: scale(1.02); }
          100% { transform: scale(1); opacity: 1; }
        }
        .animate-bounce-in { animation: bounce-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

{

</script>
