name: Deploy to FTP

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 🟢 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: 📦 Install dependencies
        # 依存関係のインストール漏れを防ぐ
        run: |
          npm install --legacy-peer-deps
          npm install viem @farcaster/frame-sdk lucide-react --legacy-peer-deps

      - name: 🏗️ Build Project
        env:
           CI: false # 警告をエラーとして扱わないようにする
           VITE_ALCHEMY_API_KEY: ${{ secrets.VITE_ALCHEMY_API_KEY }}
        run: |
          npm run build
          mkdir -p ./dist/api
          cp -r ./api/* ./dist/api/
          cd ./dist/api
          composer install --no-dev --optimize-autoloader
          
      - name: 🔍 Verify Build Output
        run: ls -la ./dist

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # アップロードするローカルのフォルダ
          local-dir: ./dist/
          # アップロード先のサーバー上のフォルダ
          # 一般的なレンタルサーバーでは ./public_html/ が多いです。
          # ルートディレクトリの場合は ./ のままでOKです。
          server-dir: ./
          # SSL証明書のエラーを無視して接続を試みる（接続エラー対策）
          security: loose
          # 隠しファイルなどを除外
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
